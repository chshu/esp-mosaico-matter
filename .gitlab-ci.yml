stages: [pre_check, build]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  IDF_CCACHE_ENABLE: "1"
  CCACHE_DIR: "$CI_PROJECT_DIR/.cache/ccache"

default:
  tags: [build]

pre_commit:
  stage: pre_check
  image: python:3.11-bookworm
  script:
    - apt-get update && apt-get install -y --no-install-recommends cppcheck git
    - pip install -r requirements-dev.txt
    - pre-commit run --all-files

build_firmware:
  stage: build
  image: espressif/idf:latest
  cache:
    key: "esp32s31"
    paths: [.cache/ccache/]
  script:
    - . tools/ci/setup_idf.sh
    - |
      for variant in matter_hub_claw matter_hub_xiaozhi matter_hub_no_agent matter_bridge; do
        project=examples/matter_hub
        if [ "$variant" = matter_bridge ]; then
          project=examples/matter_bridge
        fi
        # CMake patches managed dependencies; fullclean refuses to remove them.
        # Reset generated CI files directly so each variant starts fresh.
        rm -rf "$project/build" "$project/managed_components"
        rm -f "$project/sdkconfig" "$project/sdkconfig.old"
        bash tools/ci/build_firmware.sh "$variant"
        # Save each variant's metadata before the next build replaces it.
        artifact_dir="build/firmware/configs/$variant"
        mkdir -p "$artifact_dir"
        cp "$project/build/flasher_args.json" "$project/sdkconfig" \
          "$project/dependencies.lock" "$artifact_dir/"
      done
  artifacts:
    name: "firmware-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/firmware/images/
      - build/firmware/configs/
    expire_in: 1 week
